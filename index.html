<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D0C;
    --graphite:#2A2E2C;
    --mist:#B9BFBB;
    --white:#F4F6F4;
    --lime-a:#C6D92E;
    --lime-b:#3FA435;
    --glass:rgba(20,23,21,.5);
    --glass-hi:rgba(255,255,255,.07);
    --glass-border:rgba(185,191,187,.16);
    --wdth:78;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:var(--lime-a);color:var(--bg)}

  .lg{
    position:relative;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(1.5);
    -webkit-backdrop-filter:blur(22px) saturate(1.5);
    border:1px solid var(--glass-border);
    box-shadow:0 8px 32px rgba(0,0,0,.45), inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(0,0,0,.25);
    overflow:hidden;
  }
  .lg::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.05) 46%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 54%,transparent 70%);
    background-size:280% 280%;background-position:120% 0;
    transition:background-position .9s cubic-bezier(.16,1,.3,1);
  }
  .lg:hover::before{background-position:-40% 0}

  /* ── ambient film ── */
  #bgv{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:0;
    filter:brightness(.85);
  }
  #veil{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 60%, rgba(11,13,12,.25) 0%, rgba(11,13,12,.72) 100%)}

  /* ── card ── */
  main{
    position:relative;z-index:2;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,2.4vh,24px);
    padding:max(4vh,20px) 20px;
    text-align:center;
  }
  .logo{
    font-family:'Archivo';font-variation-settings:'wdth' var(--wdth),'wght' 800;
    text-transform:uppercase;font-size:clamp(30px,4.6vh,42px);letter-spacing:.2em;color:var(--white);
  }
  .logo em{font-style:normal;background:linear-gradient(120deg,var(--lime-a),var(--lime-b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font-size:clamp(9px,1.3vh,11px);letter-spacing:.52em;color:var(--mist);font-variation-settings:'wdth' 100,'wght' 500;margin-top:6px}

  h1{
    font-family:'Archivo';font-variation-settings:'wdth' var(--wdth),'wght' 680;
    text-transform:uppercase;
    font-size:clamp(26px,5.6vh,52px);line-height:.95;letter-spacing:.01em;color:var(--white);
  }
  h1 .l{display:inline-block;font-variation-settings:'wdth' var(--wdth),'wght' 680}
  h1 em{font-style:normal}
  h1 em .l{background:linear-gradient(120deg,var(--lime-a),var(--lime-b));-webkit-background-clip:text;background-clip:text;color:transparent}

  .sub{font-size:clamp(11px,1.7vh,14px);font-weight:300;color:var(--mist);line-height:1.6}
  .sub b{color:var(--white);font-weight:500}

  /* ── links ── */
  .links{
    display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);
    width:min(440px,92vw);
  }
  .link{
    display:flex;align-items:center;justify-content:center;gap:12px;
    padding:clamp(13px,2vh,18px) 20px;border-radius:100px;
    font-size:clamp(13px,1.9vh,15px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--white);text-decoration:none;cursor:pointer;
    transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,border-color .2s;
  }
  .link:hover{transform:scale(1.035)}
  .link.solid{
    background:linear-gradient(120deg,var(--lime-a),var(--lime-b));
    color:var(--bg);border:none;
  }
  .link.solid:hover{box-shadow:0 0 34px rgba(198,217,46,.45)}
  .link:not(.solid):hover{border-color:rgba(198,217,46,.45)}
  .link svg{width:18px;height:18px;flex:0 0 auto}
  .link .en{font-size:10px;letter-spacing:.2em;color:var(--mist);font-weight:500}
  .link.solid .en{color:rgba(11,13,12,.65)}

  /* ── mini carousel ── */
  #strip{
    display:flex;gap:5px;align-items:center;justify-content:center;
    width:min(560px,94vw);
  }
  #strip .panel{
    position:relative;display:block;overflow:hidden;cursor:pointer;
    border-radius:14px;
    width:2.4rem;height:clamp(5.2rem,11vh,7.5rem);
    flex:0 0 auto;
    transition:width .38s cubic-bezier(.16,1,.3,1);
    border:1px solid var(--glass-border);
    box-shadow:0 6px 22px rgba(0,0,0,.4), inset 0 1px 0 var(--glass-hi);
  }
  #strip .panel img{width:100%;height:100%;object-fit:cover;display:block}
  #strip .panel.active{width:clamp(7rem,16vh,10.5rem)}
  @media(max-height:640px){#strip{display:none}}

  footer{
    position:relative;z-index:2;
    font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);
    opacity:.75;
  }
  footer a{color:var(--mist);text-decoration:none}
  footer a:hover{color:var(--lime-a)}

  @media (prefers-reduced-motion: reduce){
    .lg::before{transition:none}
    #bgv{display:none}
    body{background:var(--bg) url('frames/frame_001.webp') center/cover no-repeat}
  }
</style>
</head>
<body>

<script>
(() => {
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* pick background video by viewport (media attr on <video><source> is ignored by browsers) */
  const bgv = document.getElementById("bgv");
  if (!reduced) {
    bgv.src = (innerWidth || screen.width) <= 768 ? "bg-mobile.mp4" : "bg.mp4";
    bgv.play && bgv.play().catch(() => {});
  }

  /* variable font proximity on the headline */
  const REACH = 220, FROM_W = 680, TO_W = 900, WDTH = 78;
  const fromSettings = `'wdth' ${WDTH}, 'wght' ${FROM_W}`;
  const letters = [];
  function splitLetters(node) {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const ch of child.textContent) {
          if (ch === " ") { frag.appendChild(document.createTextNode(" ")); continue; }
          const s = document.createElement("span");
          s.className = "l"; s.textContent = ch;
          frag.appendChild(s);
          letters.push({ el: s, f: 0 });
        }
        child.replaceWith(frag);
      } else if (child.nodeType === 1 && child.tagName !== "BR") splitLetters(child);
    });
  }
  document.querySelectorAll("[data-fx]").forEach(h => splitLetters(h));

  const mouse = { x: -99999, y: -99999 };
  addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener("touchmove", e => {
    if (!e.touches.length) return;
    mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  }, { passive: true });

  let lastT = 0;
  function tick(now) {
    const dt = Math.min(0.1, Math.max(0, (now - (lastT || now)) / 1000));
    lastT = now;
    const a = 1 - Math.exp(-dt / 0.18);
    for (const L of letters) {
      const r = L.el.getBoundingClientRect();
      const dx = mouse.x - (r.left + r.width / 2);
      const dy = mouse.y - (r.top + r.height / 2);
      const t = Math.min(Math.max(1 - Math.sqrt(dx * dx + dy * dy) / REACH, 0), 1);
      L.f += (t - L.f) * a;
      if (L.f < 0.001) {
        if (L.el.style.fontVariationSettings !== fromSettings) L.el.style.fontVariationSettings = fromSettings;
        continue;
      }
      const w = Math.round(FROM_W + (TO_W - FROM_W) * L.f);
      L.el.style.fontVariationSettings = `'wdth' ${WDTH}, 'wght' ${w}`;
    }
    requestAnimationFrame(tick);
  }
  if (!reduced) requestAnimationFrame(tick);

  /* mini hover-expand strip */
  const panels = [...document.querySelectorAll("#strip .panel")];
  panels.forEach(panel => {
    const activate = () => panels.forEach(x => x.classList.toggle("active", x === panel));
    panel.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") activate(); });
    panel.addEventListener("click", e => {
      if (!panel.classList.contains("active")) { e.preventDefault(); activate(); }
    });
  });
})();
</script>
